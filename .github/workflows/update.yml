name: Update stats and deploy

on:
  # Scheduled pulls removed 2026-11-16: HSL stopped publishing game stats (game pages no longer
  # carry box scores; every run from Nov 14 failed the structure check). The old schedule was
  # nightly 04:17 UTC, Monday 15:17 UTC, and every 2 h on Fri-Sun game days — restore from git
  # history if the league starts publishing again. Manual runs, /update and deploys still work.
  workflow_dispatch:
    inputs:
      refetch_all:
        description: 'Re-fetch every final game (not just new/recent ones)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'test/**', '.github/workflows/**']
  # Phone-friendly manual pull: comment "/update" on any issue (the pinned "Request a stats update"
  # issue). Only the repo owner's comments run it — the repo is public.
  issue_comment:
    types: [created]

permissions:
  contents: write   # commit refreshed data back to the repo
  pages: write
  id-token: write
  issues: write     # reply on the /update issue

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issue_comment' || (github.event.comment.user.login == 'craigpoff1' && startsWith(github.event.comment.body, '/update'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Acknowledge /update request
        if: github.event_name == 'issue_comment'
        run: gh api -X POST repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Parser regression tests
        run: npm test

      # Non-fatal since HSL stopped publishing (2026-11-16): a failed game is never written (parse
      # throws first), so the build keeps the last good data and site deploys still go out.
      - name: Scrape league site (non-fatal)
        run: node scripts/scrape.mjs ${{ inputs.refetch_all && '--all' || '' }} || echo "::warning::league scrape failed; keeping last copies"

      - name: Tournaments + opponent leagues (non-fatal)
        run: node scripts/events.mjs || echo "events fetch failed; keeping last copies"

      # 2018 Major stat gallery (site/2018). Non-fatal: a problem there must never block the main site.
      - name: Scrape 2018 Major (non-fatal)
        run: DIVISION=2018 node scripts/scrape.mjs ${{ inputs.refetch_all && '--all' || '' }} || echo "2018 scrape failed; keeping last copies"

      - name: Scrape 2018 Minor (non-fatal)
        run: DIVISION=2018minor node scripts/scrape.mjs ${{ inputs.refetch_all && '--all' || '' }} || echo "2018 Minor scrape failed; keeping last copies"

      - name: Build stats (encrypted)
        run: node scripts/build.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Build 2018 Major gallery (encrypted, non-fatal)
        run: DIVISION=2018 node scripts/build.mjs || echo "2018 build failed; gallery keeps showing its error page"
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Build 2018 Minor gallery (encrypted, non-fatal)
        run: DIVISION=2018minor node scripts/build.mjs || echo "2018 Minor build failed; its tab shows an error"
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Commit data changes
        run: |
          git config user.name "stat-track bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new game data."
          else
            git commit -m "Update game data"
            # Rebase over any push that landed while this run was scraping.
            git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)
          fi

      # Pages serves files with max-age=600, so browsers keep an old app.js/style.css for up to 10 min
      # after a deploy. A per-commit ?v= stamp makes every deploy fetch the new code immediately.
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -e "s#href=\"style.css\"#href=\"style.css?v=$V\"#" -e "s#src=\"app.js\"#src=\"app.js?v=$V\"#" site/index.html
          sed -i -e "s#href=\"../style.css\"#href=\"../style.css?v=$V\"#" -e "s#src=\"gallery.js\"#src=\"gallery.js?v=$V\"#" site/2018/index.html
          grep -E "style.css|app.js|gallery.js" site/index.html site/2018/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Reply on the /update issue
        if: always() && github.event_name == 'issue_comment'
        run: |
          if [ "${{ job.status }}" = "success" ]; then MSG="✅ Updated — refresh the site to see the latest games."; else MSG="⚠️ The update failed — details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
        env:
          GH_TOKEN: ${{ github.token }}
