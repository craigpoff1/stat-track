name: Update stats and deploy

on:
  schedule:
    # Games can be any day of the week. Run nightly (04:17 UTC = ~10 PM MDT / 9 PM MST),
    # plus a Monday-morning catch-up for late weekend sheets and stat corrections.
    - cron: '17 4 * * *'
    - cron: '17 15 * * 1'
  workflow_dispatch:
    inputs:
      refetch_all:
        description: 'Re-fetch every final game (not just new/recent ones)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'test/**', '.github/workflows/**']

permissions:
  contents: write   # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Parser regression tests
        run: npm test

      - name: Scrape league site
        run: node scripts/scrape.mjs ${{ inputs.refetch_all && '--all' || '' }}

      - name: Tournaments + opponent leagues (non-fatal)
        run: node scripts/events.mjs || echo "events fetch failed; keeping last copies"

      - name: Build stats (encrypted)
        run: node scripts/build.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Commit data changes
        run: |
          git config user.name "stat-track bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new game data."
          else
            git commit -m "Update game data"
            # Rebase over any push that landed while this run was scraping.
            git pull --rebase && git push || (sleep 5 && git pull --rebase && git push)
          fi

      # Pages serves files with max-age=600, so browsers keep an old app.js/style.css for up to 10 min
      # after a deploy. A per-commit ?v= stamp makes every deploy fetch the new code immediately.
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -e "s#href=\"style.css\"#href=\"style.css?v=$V\"#" -e "s#src=\"app.js\"#src=\"app.js?v=$V\"#" site/index.html
          grep -E "style.css|app.js" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
